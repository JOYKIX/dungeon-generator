<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur procédural RPG (cave, forêt, ville, ruines, marais)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="panel">
            <h1>Générateur procédural RPG avancé</h1>
            <p class="subtitle">Cave, forêt, ville, ruines et marais avec seed contrôlable et export JSON.</p>

            <div class="controls-grid">
                <label>
                    Biome
                    <select id="biome">
                        <option value="cave">Cave</option>
                        <option value="forest">Forêt</option>
                        <option value="city">Ville</option>
                        <option value="ruins">Ruines</option>
                        <option value="swamp">Marais</option>
                    </select>
                </label>
                <label>
                    Largeur
                    <input type="number" id="width" min="18" max="160" value="56">
                </label>
                <label>
                    Hauteur
                    <input type="number" id="height" min="18" max="120" value="36">
                </label>
                <label>
                    Taille tuile
                    <input type="number" id="tileSize" min="10" max="40" value="20">
                </label>
                <label>
                    Intensité génération
                    <input type="range" id="intensity" min="20" max="90" value="60">
                    <span id="intensityValue">60%</span>
                </label>
                <label>
                    Itérations/lissage
                    <input type="number" id="iterations" min="1" max="12" value="5">
                </label>
                <label>
                    Seed (optionnel)
                    <input type="text" id="seed" placeholder="laisse vide pour aléatoire">
                </label>
            </div>

            <div class="toggles">
                <label><input type="checkbox" id="showOverlay" checked> Détails visuels (ombres, reliefs, eau)</label>
                <label><input type="checkbox" id="showGrid"> Grille légère</label>
            </div>

            <div class="actions">
                <button id="generateBtn">Générer</button>
                <button id="randomSeedBtn" class="secondary">Seed aléatoire</button>
                <button id="copyBtn" class="secondary">Copier JSON</button>
            </div>

            <p id="stats" class="stats"></p>
            <div id="legend" class="legend"></div>
        </section>

        <section class="canvas-wrap">
            <div id="map" aria-label="Carte procédurale" role="img"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
