<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Generator Studio</title>
    <meta name="description" content="Studio visuel de génération procédurale pour RPG : cave, forêt, ville, ruines et marais.">
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div class="background-glow" aria-hidden="true"></div>

    <header class="topbar">
        <div>
            <p class="eyebrow">Dungeon Generator</p>
            <h1>Studio procédural RPG</h1>
            <p class="subtitle">Un redesign complet avec presets, historique de seeds, analytics live et export JSON.</p>
        </div>
        <button id="surpriseBtn" class="ghost">Mode surprise</button>
    </header>

    <main class="layout">
        <aside class="sidebar card">
            <section>
                <h2>Paramètres</h2>
                <div class="controls-grid">
                    <label>Biome
                        <select id="biome">
                            <option value="cave">Cave</option>
                            <option value="forest">Forêt</option>
                            <option value="city">Ville</option>
                            <option value="ruins">Ruines</option>
                            <option value="swamp">Marais</option>
                        </select>
                    </label>
                    <label>Largeur<input type="number" id="width" min="18" max="200" value="72"></label>
                    <label>Hauteur<input type="number" id="height" min="18" max="150" value="44"></label>
                    <label>Taille tuile<input type="number" id="tileSize" min="8" max="40" value="16"></label>
                    <label>Intensité
                        <input type="range" id="intensity" min="20" max="95" value="65">
                        <span id="intensityValue">65%</span>
                    </label>
                    <label>Itérations<input type="number" id="iterations" min="1" max="14" value="6"></label>
                    <label>Seed<input type="text" id="seed" placeholder="laisse vide pour random"></label>
                </div>
            </section>

            <section>
                <h3>Affichage</h3>
                <div class="toggles">
                    <label><input type="checkbox" id="showOverlay" checked> Ombres & reliefs</label>
                    <label><input type="checkbox" id="showGrid"> Grille visible</label>
                </div>
            </section>

            <section>
                <h3>Actions</h3>
                <div class="actions">
                    <button id="generateBtn">Générer</button>
                    <button id="randomSeedBtn" class="secondary">Seed aléatoire</button>
                    <button id="copyBtn" class="secondary">Copier JSON</button>
                </div>
            </section>
        </aside>

        <section class="main card">
            <div class="map-toolbar">
                <p id="stats" class="stats"></p>
                <div id="legend" class="legend"></div>
            </div>
            <div class="canvas-wrap">
                <div id="map" aria-label="Carte procédurale" role="img"></div>
            </div>
        </section>

        <aside class="insights card">
            <section>
                <h2>Presets rapides</h2>
                <div class="preset-grid">
                    <button class="preset" data-preset="dungeon">Donjon dense</button>
                    <button class="preset" data-preset="frontier">Frontière sauvage</button>
                    <button class="preset" data-preset="capital">Capitale</button>
                    <button class="preset" data-preset="lost">Citadelle perdue</button>
                </div>
            </section>

            <section>
                <h3>Répartition des tuiles</h3>
                <ul id="tileBreakdown" class="breakdown"></ul>
            </section>

            <section>
                <h3>Historique récent</h3>
                <ol id="history" class="history"></ol>
            </section>
        </aside>
    </main>

    <footer class="footer">Tips: appuie sur <kbd>R</kbd> pour regénérer et <kbd>C</kbd> pour copier le JSON.</footer>

    <script src="src/scripts/app.js"></script>
</body>
</html>
