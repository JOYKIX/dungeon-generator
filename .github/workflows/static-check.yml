name: Static Checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify expected files exist
        run: |
          test -f index.html
          test -f src/scripts/app.js
          test -f src/styles/main.css
          test -f docs/ARCHITECTURE.md
